<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>Ribbon Slider</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
    <!-- ビルドなしで three / gsap を CDN から読み込む -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
          "gsap/SplitText": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/SplitText.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="slider"></div>

    <!-- 展開時に表示する詳細 -->
    <div class="slide-detail" aria-live="polite">
      <div class="container">
        <h1 class="detail-title"></h1>
        <p class="detail-description"></p>
      </div>
      <p class="detail-close"><span>Click to close</span></p>
    </div>

    <!-- 下部インフォバー -->
    <div class="slide-info">
      <div class="container">
        <p><span class="info-title"></span></p>
        <p><span>Drag · Scroll · Click</span></p>
        <p class="info-count"><span class="info-counter"></span></p>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
